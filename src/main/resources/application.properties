# JWT Configuration
# The secret key will be loaded from the APP_JWT_SECRET environment variable
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.ttl-seconds=300
app.jwt.issuer=owasp-api-vuln-lab
app.jwt.audience=owasp-api-users

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:apilab
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true